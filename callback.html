<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AutoPost Bot — вход</title>
<link rel="stylesheet" href="style.css">
<style>
  .box { border: 1px solid #8884; border-radius: 10px; padding: 16px; word-break: break-all; font-family: ui-monospace, Consolas, monospace; font-size: 14px; }
  button { margin-top: 12px; padding: 12px 20px; font-size: 16px; border: 0; border-radius: 8px; background: var(--link); color: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1 id="title">TikTok подключён</h1>
  <p id="hint">Скопируйте адрес ниже и отправьте его Claude в чат.</p>
  <div class="box" id="url"></div>
  <button id="copy">Скопировать</button>
</main>
<script>
  var url = location.href;
  var q = new URLSearchParams(location.search);
  if (q.get("error")) {
    document.getElementById("title").textContent = "Доступ не выдан";
    document.getElementById("hint").textContent = "Ошибка TikTok: " + (q.get("error_description") || q.get("error"));
  }
  document.getElementById("url").textContent = url;
  document.getElementById("copy").onclick = function () {
    navigator.clipboard.writeText(url).then(function () {
      document.getElementById("copy").textContent = "Скопировано ✓";
    });
  };
</script>
</body>
</html>
